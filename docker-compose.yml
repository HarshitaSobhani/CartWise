# Local development / evaluation stack. Change all credentials before any shared use.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cartwise
      POSTGRES_PASSWORD: cartwise
      POSTGRES_DB: cartwise
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cartwise']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
  api:
    build: { context: ., dockerfile: server/Dockerfile }
    environment: &env
      DATABASE_URL: postgresql://cartwise:cartwise@postgres:5432/cartwise
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-me-please}
      CORS_ORIGIN: http://localhost:8080
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      NODE_ENV: production
      COOKIE_SECURE: 'false'
      SMTP_HOST: ${SMTP_HOST:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: sh -c "npx prisma migrate deploy && node dist/src/server.js"
    ports: ['4000:4000']
  worker:
    build: { context: ., dockerfile: server/Dockerfile }
    environment: *env
    depends_on:
      api: { condition: service_started }
    command: node dist/src/worker.js
  web:
    build: { context: ., dockerfile: web/Dockerfile }
    depends_on: [api]
    ports: ['8080:80']
volumes:
  pgdata:
